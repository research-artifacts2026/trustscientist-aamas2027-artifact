  <text x="1331" y="322" text-anchor="middle" font-weight="normal" font-size="16" font-family="Arial" fill="#34495e">bindings | reasons | risk/coverage</text>



  <rect x="257" y="391" width="986" height="98" rx="15" fill="#fff8e8" stroke="#b7791f" stroke-width="2.2" />
  <text x="750" y="421" text-anchor="middle" fill="#805410" font-weight="bold" font-size="23" font-family="Arial">Counterfactual Branch Revalidation (CBR)</text>
  <text x="750" y="454" text-anchor="middle" fill="#805410" font-weight="normal" font-size="19" font-family="Arial">evidence update → affected decisions → replay → earliest flip → rollback</text>
  <text x="750" y="480" text-anchor="middle" font-size="21" font-weight="normal" font-family="Arial" fill="#34495e">receipts: policy | context | input versions | action | checkpoint</text>
